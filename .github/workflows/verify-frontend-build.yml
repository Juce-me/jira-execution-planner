name: verify-frontend-build
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: npm ci
      - name: Install backend
        run: python -m pip install -r requirements.txt
      - name: Build frontend
        run: npm run build
      - name: Locate PostgreSQL test server binaries
        run: |
          bin="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -n 1)"
          test -x "$bin/initdb" || { echo "PostgreSQL server binaries are required for backend tests." >&2; exit 1; }
          echo "JEP_TEST_PG_BIN=$bin" >> "$GITHUB_ENV"
      - name: Backend tests
        run: python tests/run_isolated_runtime_tests.py --node "$(command -v node)"
      - name: Endpoint security tests
        run: python tests/run_isolated_runtime_tests.py --node "$(command -v node)" tests.test_endpoint_policy_inventory tests.test_endpoint_security_matrix tests.test_network_bind_guards tests.test_security_headers tests.test_oauth_route_guards tests.test_backend_route_source_guards tests.test_route_move_preservation
      - name: Frontend tests
        run: npm run test:frontend:unit
