<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Project Track — approved Left capacity design</title></head>
<body style="margin:0">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Crimson+Pro:wght@400;600&display=swap');
#track-strips{color-scheme:light dark;--ts-bg:light-dark(#f8f7f4,#211f1c);--ts-paper:light-dark(#fff,#292724);--ts-text:light-dark(#1a1a1a,#ece9e3);--ts-muted:light-dark(#666,#bcb6ad);--ts-border:light-dark(#e0ddd7,#49453f);--ts-commit:#5b6fd8;--ts-flex:#e0a93b;--ts-done:#52c41a;--ts-progress:#69c0ff;--ts-todo:light-dark(#e8edf7,#535d70);padding:20px;background:var(--ts-bg);font:16px/1.5 'Crimson Pro',Georgia,serif;color:var(--ts-text)}
#track-strips *{box-sizing:border-box}#track-strips .panel{background:var(--ts-paper);border:1px solid var(--ts-border);border-radius:10px;padding:17px 18px 12px;box-shadow:0 8px 18px #1d1d1d0a}#track-strips .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}#track-strips h3{margin:0;font:600 12px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.12em}#track-strips .scope{font-size:13px;color:var(--ts-muted)}#track-strips .legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--ts-muted);margin:12px 0 22px}#track-strips .legend i{display:inline-block;width:10px;height:7px;border-radius:2px;vertical-align:middle;margin-right:5px}#track-strips .rows{display:grid;gap:18px}#track-strips .row{display:grid;grid-template-columns:160px 64px minmax(0,1fr);gap:14px;align-items:start}#track-strips .name{font-weight:600;line-height:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#track-strips .total{text-align:right;font-weight:600;color:var(--ts-muted);line-height:30px;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}#track-strips .tracks{display:flex;min-width:0;gap:0}#track-strips .track{min-width:0}#track-strips .track-label{height:30px;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;padding:0 8px;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.05em;color:#fff}#track-strips .track-label span{overflow:hidden;text-overflow:ellipsis}#track-strips .track:first-child .track-label{border-radius:6px 0 0 6px}#track-strips .track:last-child .track-label{border-radius:0 6px 6px 0}#track-strips .committed .track-label{background:var(--ts-commit)}#track-strips .flexible .track-label{background:var(--ts-flex)}#track-strips .strip{display:flex;width:100%;height:7px;border:0;padding:0;margin:3px 0 0;background:none;cursor:pointer}#track-strips .track:first-child .strip{border-radius:3px 0 0 3px;overflow:hidden}#track-strips .track:last-child .strip{border-radius:0 3px 3px 0;overflow:hidden}#track-strips .strip span{display:block;height:7px;flex-shrink:0}#track-strips .strip .done{background:var(--ts-done)}#track-strips .strip .progress{background:linear-gradient(90deg,#69c0ff,#2f80ed,#69c0ff)}#track-strips .strip .todo{background:var(--ts-todo)}#track-strips .left{font:11px/1.5 'IBM Plex Mono',monospace;color:var(--ts-muted);padding-top:4px;text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}#track-strips .left strong{color:var(--ts-text);font-weight:600}#track-strips .readout{margin-top:18px;border-top:1px solid var(--ts-border);padding-top:9px;font-size:13px;color:var(--ts-muted);min-height:30px}#track-strips .sample{margin-top:9px;font-size:12px;color:var(--ts-muted)}@media(max-width:750px){#track-strips .row{grid-template-columns:108px 50px minmax(0,1fr);gap:9px}#track-strips .track-label{font-size:10px;letter-spacing:0}#track-strips{padding:12px}#track-strips .panel{padding:14px}#track-strips .name{font-size:15px}}@media(max-width:520px){#track-strips .row{grid-template-columns:1fr auto;gap:3px 8px}#track-strips .tracks{grid-column:1/3}#track-strips .rows{gap:14px}#track-strips .name,#track-strips .total{line-height:22px}#track-strips .legend{gap:8px 12px;margin-bottom:16px}#track-strips .left{font-size:10px}}
</style>
<section id="track-strips" aria-label="Existing By team bars extended with status strips, design preview">
 <div class="panel">
  <div class="head"><h3>By team</h3><span class="scope">Selected sprint · Sprint 24</span></div>
  <div class="legend"><span><i style="background:var(--ts-done)"></i>Spent (Done + Incomplete)</span><span><i style="background:var(--ts-progress)"></i>In Progress</span><span><i style="background:var(--ts-todo)"></i>To Do</span></div>
  <div class="rows"></div>
  <div class="readout" aria-live="polite">Select a status strip for its exact SP breakdown.</div>
 </div>
 <div class="sample">Sample data · Status widths use story points · Killed excluded</div>
</section>
<script>
(()=>{
const root=document.getElementById('track-strips'),rows=root.querySelector('.rows'),readout=root.querySelector('.readout');
const teams=[
 {name:'Team Alpha',c:[7,3,2],f:[18.7,9,6]},
 {name:'Team Beta',c:[3.6,2,2],f:[5,5,3]},
 {name:'Team Gamma',c:[1.1,2,1],f:[6.7,4,3]},
 {name:'Team Delta',c:[1,0.5,0.5],f:[3,3,2]},
 {name:'Team Epsilon',c:[0,1,1],f:[2.7,2,1]},
 {name:'Team Zeta',c:[0.5,0.5,0],f:[1,0,1]}
];
const sum=xs=>xs.reduce((a,b)=>a+b,0),fmt=n=>String(Math.round(n*10)/10);
teams.forEach(team=>{
 const total=sum(team.c)+sum(team.f),row=document.createElement('div');row.className='row';
 const name=document.createElement('span');name.className='name';name.textContent=team.name;
 const amount=document.createElement('span');amount.className='total';amount.textContent=`${fmt(total)} SP`;
 const tracks=document.createElement('div');tracks.className='tracks';row.append(name,amount,tracks);
 [['c','Committed'],['f','Flexible']].forEach(([key,label])=>{
  const values=team[key],trackTotal=sum(values),left=values[1]+values[2],track=document.createElement('div');track.className=`track ${label.toLowerCase()}`;track.style.width=`${trackTotal/total*100}%`;
  const title=document.createElement('div');title.className='track-label';const text=document.createElement('span');text.textContent=`${label.toUpperCase()} ${fmt(trackTotal)} SP`;title.appendChild(text);
  const strip=document.createElement('button');strip.type='button';strip.className='strip';
  const detail=`${team.name} · ${label}: ${fmt(trackTotal)} SP total · ${fmt(values[0])} spent · ${fmt(values[1])} in progress · ${fmt(values[2])} to do · ${fmt(left)} left`;
  strip.setAttribute('aria-label',detail);['done','progress','todo'].forEach((state,i)=>{const segment=document.createElement('span');segment.className=state;segment.style.width=`${values[i]/trackTotal*100}%`;strip.appendChild(segment);});
  strip.onclick=()=>{readout.textContent=detail;};strip.onfocus=()=>{readout.textContent=detail;};
  const remaining=document.createElement('div');remaining.className='left';const strong=document.createElement('strong');strong.textContent=`${fmt(left)} SP`;remaining.append(strong,document.createTextNode(' left'));
  track.append(title,strip,remaining);tracks.appendChild(track);
 });rows.appendChild(row);
});
})();
</script>

</body>
</html>
