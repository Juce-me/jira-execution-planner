.onboarding-tour-layer {

  position: relative;

}

}
.onboarding-tour-raised-path {

}
.onboarding-tour-preview-note {

}
.is-preview-only [role=menuitem] {

}

}
.onboarding-tour-progress {
  margin-bottom: 0.45rem;

  font-size: 0.68rem;

.onboarding-tour-card h2 {

  font-size: 1.1rem;
  line-height: 1.3;

.onboarding-tour-card p {
  margin: 0.65rem 0 1rem;
  color: var(--text-secondary);
  font-size: 1rem;
  line-height: 1.5;
}
.onboarding-tour-actions {
  display: grid;
  grid-template-columns: max-content 1fr;
  align-items: center;
  gap: 0.55rem;
}
.onboarding-tour-navigation {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 0.55rem;
  justify-content: flex-end;
  min-width: 0;
}
.onboarding-tour-actions button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: var(--control-height);

  padding-top: 0;
  padding-right: 0.75rem;
  padding-bottom: 0;
  padding-left: 0.75rem;

}
.onboarding-tour-action-next:hover {
  border-color: #40a9ff;
  background: #40a9ff;
  color: #1f1f1f;
}
.onboarding-tour-action-skip-all.secondary {
  border: 1px solid #ff4d4f;
  background: #ff4d4f;
  color: #fff;
}
.onboarding-tour-action-skip-all.secondary:hover {
  border-color: #d9363e;
  background: #d9363e;
  color: #fff;
}
.onboarding-tour-action-skip-section.secondary {
  border-color: #ff4d4f;
  background: transparent;
  color: #cf1322;
}
.onboarding-tour-action-skip-section.secondary:hover {
  border-color: #d9363e;
  background: #fff1f0;
  color: #a8071a;
}
.onboarding-tour-action-next:disabled {
  border-color: #91caff;
  background: #bae0ff;
  color: #434d56;
  opacity: 1;
}
.onboarding-tour-action-skip-all.secondary:disabled {
  border-color: #ffccc7;
  background: #ffccc7;
  color: #714342;
  opacity: 1;
}
.onboarding-tour-action-skip-section.secondary:disabled {
  border-color: #ffb3b4;
  background: transparent;
  color: #8c4646;
  opacity: 1;
}
.onboarding-tour-card button:focus-visible {
  outline: 2px solid #1d39c4;
  outline-offset: 2px;
}
@media (min-width: 761px) and (max-width: 820px) {
  .onboarding-tour-actions {
    grid-template-columns: 1fr;
  }
  .onboarding-tour-action-skip-all {
    justify-self: start;
  }
  .onboarding-tour-navigation {
    grid-column: 1;
    justify-content: flex-end;
  }
}
@media (max-width: 520px) {
  .onboarding-tour-card {
    padding: 0.9rem;
  }
  .onboarding-tour-actions {
    align-items: stretch;
    flex-direction: column-reverse;
  }
  .onboarding-tour-navigation,
  .onboarding-tour-actions > button {
    width: 100%;
  }
  .onboarding-tour-navigation button {
    flex: 1 1 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  .onboarding-tour-spotlight {
    transition: none;
  }
}

.task-item {
  background: var(--bg-secondary);
  border-left: 3px solid rgba(224, 221, 215, 0.7);
  padding: 1rem 1.25rem;
  margin-bottom: 0.9rem;
  transition:
    box-shadow 0.2s ease,
    border-left-color 0.2s ease,
    opacity 0.14s ease,
    background-color 0.14s ease,
    outline 0.14s ease,
    outline-offset 0.14s ease;
  position: relative;
  border-radius: 10px;
  animation: task-appear 0.18s ease-out both;
}
.task-item.is-removing {
  pointer-events: none;
  overflow: hidden;
  animation: task-remove-dissolve 0.24s ease-out forwards;
}
.task-item::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(239, 68, 68, 0.12);
  opacity: 0;
  pointer-events: none;
  border-radius: 10px;
}
.task-item:hover {
  border-left-color: var(--accent);
  box-shadow: inset 3px 0 0 var(--accent), -6px 0 18px var(--shadow);
}
@keyframes task-appear {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.task-item.task-highlight::after {
  animation: taskHighlightPulse 1.8s ease-in-out;
}
@keyframes taskHighlightPulse {
  0% {
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  40% {
    opacity: 0;
  }
  60% {
    opacity: 1;

  80% {
    opacity: 0;

  100% {
    opacity: 0;

/* frontend/src/styles/scenario/shell.css */
.scenario-panel {
  background: transparent;
  border: 1px solid transparent;
  margin-top: 0;
  margin-bottom: 0;
  overflow: hidden;
  max-height: 0;
  padding: 0;
  opacity: 0;
  transition:
    max-height 0.6s ease,
    opacity 0.6s ease,
    padding 0.6s ease,
    margin 0.6s ease,
    border-color 0.6s ease,
    background 0.6s ease;
}
.scenario-panel.open {
  background: var(--bg-secondary);
  border-color: var(--border);
  max-height: 2400px;
  padding: 0;
  margin-top: 1rem;
  margin-bottom: 1rem;
  opacity: 1;
  overflow: visible;
  box-shadow: 0 8px 24px rgba(26, 26, 26, 0.08);
  border-radius: 0;
  box-sizing: border-box;
  width: 100%;
  max-width: none;
}
.scenario-fullbleed {

  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  background: var(--bg-secondary);
  overflow-x: hidden;
}
.scenario-inner {
  max-width: none;
  padding: 1rem 1.5rem 1.25rem;
  box-sizing: border-box;
  width: 100%;
}
.scenario-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 0.8rem;
}
.scenario-title {
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
}
.scenario-beta {
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #b45309;
  background: rgba(251, 191, 36, 0.2);
  border: 1px solid rgba(251, 191, 36, 0.35);
  border-radius: 999px;
  padding: 0.05rem 0.35rem;
}
.scenario-subtitle {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 0.25rem;
}
.scenario-controls {
  display: flex;
  align-items: flex-end;
  gap: 0.6rem;
  margin-left: auto;
  flex-wrap: wrap;
}
.scenario-controls-separator {
  width: 1px;
  height: 1.6rem;
  background: var(--border);
  align-self: center;
  flex-shrink: 0;
}
.scenario-control label {
  display: block;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
  margin-bottom: 0.35rem;
  font-family: "IBM Plex Mono", monospace;
}
.scenario-input {
  width: 100%;
  padding: 0.45rem 0.6rem;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.75rem;
  color: var(--text-primary);
}
.scenario-toggle-group {
  display: flex;
  gap: 0.4rem;
}
.scenario-toggle {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.7rem;
  padding: 0.35rem 0.6rem;
}
.scenario-toggle:not(.active):hover {
  background: #f7f5f0;
  color: var(--text-primary);
  box-shadow: none;
  transform: none;
}
.scenario-toggle.active {
  background: var(--text-primary);
  color: var(--bg-primary);
}
.scenario-toggle:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.scenario-edit-toggle {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  font-size: 0.7rem;
  padding: 0.35rem 0.6rem;
  border-radius: 4px;
  cursor: pointer;
}
.scenario-edit-toggle.active {
  background: rgba(59, 130, 246, 0.15);
  color: rgba(59, 130, 246, 0.9);
  border-color: rgba(59, 130, 246, 0.4);
}
.scenario-edit-toggle:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.scenario-bar.editable {
  cursor: grab;
}
.scenario-bar.dragging {
  cursor: grabbing;
  opacity: 0.4;
}
.scenario-drag-ghost {
  position: absolute;
  border: 2px dashed rgba(59, 130, 246, 0.7);
  background: rgba(59, 130, 246, 0.12);
  pointer-events: none;
  z-index: 10;
}
.scenario-edge.violated {
  stroke: #ef4444;
  stroke-width: 2.5;
  stroke-dasharray: 6 3;
}
.scenario-bar.dep-violated {
  box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.5);
}
.scenario-dirty-indicator {
  font-size: 0.65rem;
  color: rgba(59, 130, 246, 0.85);
  padding: 0.2rem 0.4rem;
  background: rgba(59, 130, 246, 0.1);
  border-radius: 4px;
  white-space: nowrap;
}
.scenario-team-config,
.scenario-team-header,
.scenario-team-title,
.scenario-team-defaults,
.scenario-team-default-label,
.scenario-team-grid,
.scenario-team-grid-header,
.scenario-team-name {
  display: none;
}
.scenario-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 0.75rem;
  margin-bottom: 0.9rem;
  width: 100%;
}
.scenario-summary.hidden {
  display: flex;
}
.scenario-summary-toggle {
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.6rem;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 0.35rem;
  padding: 0.15rem 0.45rem;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s ease, border-color 0.15s ease;
}
.scenario-summary-toggle:hover {
  color: var(--text-primary);
  border-color: var(--text-secondary);
}
.scenario-card {
  border: 1px solid var(--border);
  border-radius: 0.6rem;
  padding: 0.7rem;
  background: #fff;
  box-shadow: 0 6px 16px rgba(26, 26, 26, 0.06);
}
.scenario-card-warning {
  border: 2px solid #cf1322;
  background: rgba(207, 19, 34, 0.03);
}
.scenario-card-warning h4 {
  color: #cf1322;
}
.scenario-card-warning .scenario-value {
  color: #cf1322;
}
.scenario-card h4 {
  margin: 0 0 0.35rem;
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-family: "IBM Plex Mono", monospace;
  color: var(--text-secondary);
}
.scenario-card-toggle {
  cursor: pointer;
  user-select: none;
}
.scenario-card-toggle:hover {
  opacity: 0.7;
}
.scenario-card-chevron {
  display: inline-block;
  width: 0.8em;
  font-size: 0.7rem;
}
.scenario-card .scenario-value {
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.9rem;
  font-weight: 600;
}

/* frontend/src/styles/scenario/timeline.css */
.scenario-timeline {
  --scenario-label-width: 190px;
  --scenario-label-gap: 0.6rem;
  --scenario-axis-height: 26px;
  border: 1px solid var(--border);
  border-radius: 0.6rem;
  background: #fff;
  padding: 0.6rem;
  position: relative;
  max-height: 70vh;
  overflow: auto;
  width: 100%;
  margin: 0;
  box-sizing: border-box;
}
.scenario-axis {
  position: sticky;
  top: 0.5rem;
  background: #fff;
  z-index: var(--sticky-scenario-z);
  min-height: var(--scenario-axis-height);
  padding-top: 0.2rem;
  padding-left: calc(var(--scenario-label-width) + var(--scenario-label-gap));
  margin-bottom: 0.5rem;
  width: 100%;
  min-width: 0;
  overflow: visible;
}
.scenario-axis-ticks {
  position: relative;
  height: 100%;
  min-height: 1.5rem;
}
.scenario-axis-tick {
  position: absolute;
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.65rem;
  color: var(--text-secondary);
  transform: translateX(-50%);
  white-space: nowrap;
}
.scenario-lanes {
  position: relative;
  min-height: 120px;
  width: 100%;
  min-width: 0;
}
.scenario-lane {
  position: absolute;
  left: 0;
  right: 0;
  display: grid;
  grid-template-columns: var(--scenario-label-width) 1fr;
  align-items: stretch;
  gap: var(--scenario-label-gap);
  min-width: 0;
  width: 100%;
}
.scenario-lane-label {
  position: relative;
  z-index: 2;
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.7rem;
  color: var(--text-primary);
  background: transparent;
  border: none;
  padding: 0.1rem 0;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  cursor: pointer;
  min-width: 0;
  text-transform: none;
  letter-spacing: normal;
  margin-right: 0;
  border-radius: 0.45rem;
  transition:
    color 0.15s ease,
    background 0.15s ease,
    box-shadow 0.15s ease;
}
.scenario-lane-label:disabled {
  cursor: default;
  opacity: 0.7;
}
.scenario-lane-label:hover,
.scenario-lane-label:focus-visible {
  background: rgba(59, 130, 246, 0.08);
  color: #0f172a;
  transform: none;
  box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.18);
}
.scenario-lane-title {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.7rem;
  min-width: 0;
}
.scenario-lane-title-text {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.scenario-lane-key {
  font-size: 0.58rem;
  color: var(--text-secondary);
}
.scenario-lane-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.2rem;
  font-size: 0.58rem;
  color: var(--text-secondary);
}
.scenario-lane-capacity {
  border: none;
  border-radius: 0;
  padding: 0;
}
.scenario-lane-status.ok {
  color: var(--good);
  font-weight: 600;
}
.scenario-lane-status.risk,
.scenario-lane-risk {
  color: #d4380d;
  font-weight: 600;
}
.scenario-lane-sp {
  color: var(--text-secondary);
}
.scenario-lane-conflicts {
  color: #cf1322;
  font-weight: 600;
}
.scenario-lane-more {
  color: var(--text-secondary);
  font-style: italic;
}
.scenario-lane-track {
  position: relative;
  min-height: 44px;
  background: rgba(26, 26, 26, 0.02);
  border-radius: 0.5rem;
  overflow: hidden;
  min-width: 0;
}
.scenario-lane-label-container {
  position: relative;
  min-width: 0;
  overflow: hidden;
}
.scenario-assignee-label {
  position: absolute;
  left: 0;
  right: 0;
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.55rem;
  color: var(--text-secondary);
  opacity: 0.6;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 0.2rem;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.scenario-assignee-label--team-cap {
  color: #b07d2a;
  font-style: italic;
  background: rgba(253, 245, 228, 0.5);
  border-radius: 0.3rem;
}
.scenario-assignee-divider {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--border);
  opacity: 0.4;
  pointer-events: none;
  z-index: 1;
}
.scenario-bar {
  position: absolute;
  top: 6px;
  height: 32px;
  border-radius: 0.5rem;
  background: rgba(59, 130, 246, 0.16);
  border: 1px solid rgba(59, 130, 246, 0.4);
  display: flex;
  align-items: center;
  padding: 0.25rem 0.4rem;
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.62rem;
  color: var(--text-primary);
  overflow: hidden;
  cursor: pointer;
  z-index: 2;
  text-decoration: none;
  min-width: 0;
}
.scenario-bar.critical {
  border-color: #cf1322;
  background: rgba(207, 19, 34, 0.16);
}
.scenario-bar.late {
  border-color: #d4380d;
  background: rgba(212, 56, 13, 0.16);
}
.scenario-bar.done {
  border-color: rgba(34, 197, 94, 0.5);
  background: rgba(34, 197, 94, 0.12);
}
.scenario-bar.incomplete {
  background:
    linear-gradient(
      90deg,
      rgba(34, 197, 94, 0.16) var(--incomplete-progress, 50%),
      rgba(239, 68, 68, 0.08) var(--incomplete-progress, 50%));
  border: 1px solid rgba(34, 197, 94, 0.3);
  color: #888;
}
.scenario-bar.blocked {
  border-style: dashed;
  background:
    repeating-linear-gradient(
      135deg,
      rgba(212, 56, 13, 0.12),
      rgba(212, 56, 13, 0.12) 6px,
      rgba(212, 56, 13, 0.02) 6px,
      rgba(212, 56, 13, 0.02) 12px);
  padding-right: 0.75rem;
}
.scenario-bar.blocked::after {
  content: "";
  position: absolute;
  top: 4px;
  bottom: 4px;
  right: 4px;
  border-right: 2px dashed rgba(239, 68, 68, 0.85);
  pointer-events: none;
}
.scenario-bar.context {
  border-style: dashed;
  border-color: rgba(148, 163, 184, 0.6);
  background: rgba(148, 163, 184, 0.08);
  color: var(--text-secondary);
}
.scenario-bar.is-focused {
  outline: 2px solid rgba(59, 130, 246, 0.8);
  outline-offset: 2px;
}
.scenario-bar.is-upstream {
  background: rgba(239, 68, 68, 0.12);
  border-color: rgba(239, 68, 68, 0.5);
}
.scenario-bar.is-downstream {
  background: rgba(59, 130, 246, 0.12);
  border-color: rgba(59, 130, 246, 0.5);
}
.scenario-bar.flash {
  box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.35);
}
.scenario-bar.dimmed {
  opacity: 0.25;
  pointer-events: none;
}
.scenario-bar.search-match {
  box-shadow: 0 0 0 1px rgba(20, 184, 166, 0.5);
}
.scenario-bar.unscheduled {
  border-style: dotted;
  background: rgba(148, 163, 184, 0.12);
  color: var(--text-secondary);
}
.scenario-bar.excluded {
  border-style: dashed;
  border-color: rgba(148, 163, 184, 0.55);
  background:
    repeating-linear-gradient(
      135deg,
      rgba(148, 163, 184, 0.16),
      rgba(148, 163, 184, 0.16) 6px,
      rgba(148, 163, 184, 0.04) 6px,
      rgba(148, 163, 184, 0.04) 12px);
  color: var(--text-secondary);
}
.scenario-bar.assignee-conflict {
  background: rgba(207, 19, 34, 0.16);
  border: 2px solid #cf1322;
  box-shadow: 0 0 8px rgba(207, 19, 34, 0.3);
  animation: conflict-pulse 2s ease-in-out infinite;
}
@keyframes conflict-pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.85;
  }
}
.scenario-bar.out-of-sprint {
  background: rgba(212, 56, 13, 0.16);
  border: 2px solid #d4380d;
}
.scenario-bar.in-progress {
  background:
    repeating-linear-gradient(
      45deg,
      rgba(250, 173, 20, 0.16),
      rgba(250, 173, 20, 0.16) 8px,
      rgba(250, 173, 20, 0.08) 8px,
      rgba(250, 173, 20, 0.08) 16px);
  border: 2px solid #faad14;
}
.scenario-bar-inner {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  overflow: hidden;
  width: 100%;
  min-width: 0;
}
.scenario-bar-summary {
  font-size: 0.62rem;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.scenario-date-badge {
  position: absolute;
  top: 2px;
  right: 4px;
  font-size: 0.48rem;
  font-weight: 600;
  line-height: 1;
  padding: 1px 3px;
  border-radius: 2px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  pointer-events: none;
}
.scenario-date-badge-override {
  background: rgba(59, 130, 246, 0.2);
  color: rgba(59, 130, 246, 0.9);
}
.scenario-date-badge-jira {
  background: rgba(34, 197, 94, 0.15);
  color: rgba(34, 197, 94, 0.85);
}
.scenario-bar-meta {
  display: flex;
  gap: 0.35rem;
  align-items: center;
  color: var(--text-secondary);
  font-size: 0.58rem;
  white-space: nowrap;
}
.scenario-bar-key {

.epm-duplicates-issues ul {
  margin: 0.4rem 0 0;
  padding-left: 1rem;
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem 0.6rem;
}
.epm-duplicates-issues li {
  font-family: "IBM Plex Mono", monospace;
  font-size: 0.6rem;
}
.epm-duplicates-issues a {
  color: var(--epm-project-accent);
  text-decoration: none;
}
.epm-duplicates-issues a:hover {
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* frontend/src/styles/epm.css */

/* frontend/src/styles/dashboard.css */

/* Proposed spreadsheet layout only. The app's existing CSS is bundled verbatim before this file. */
*, *::before, *::after { animation: none !important; transition: none !important; }
html { scrollbar-gutter:stable; }
.reference-strip { display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 1.5rem;border-bottom:1px solid var(--border);background:#efede7;font: .64rem 'IBM Plex Mono', monospace;color:var(--text-secondary); }
.reference-strip strong { color:var(--text-primary);font-weight:500; }
.reference-strip div { display:flex;gap:.25rem; }
.reference-strip button { background:transparent;color:var(--text-secondary);border:0;border-radius:5px;padding:.35rem .65rem;font:inherit;letter-spacing:normal;transform:none;box-shadow:none; }
.reference-strip button.selected { background:var(--bg-secondary);color:var(--text-primary);box-shadow:0 1px 3px var(--shadow); }
.reference-strip button:hover { background:var(--bg-secondary);color:var(--text-primary);letter-spacing:normal;transform:none; }
.reference-workspace { max-width:none;--sticky-planning-offset:0px;--sticky-filterbar-offset:0px; }
/* Preserve the original 1040px shell's inner width and shared sticky ancestor. */
.reference-workspace > header,
.reference-workspace > .planning-panel,
.reference-workspace > .filterbar-wrap,
.reference-workspace > .reference-notice,
.reference-workspace > .reference-list { width:100%;max-width:calc(1040px - 3rem);margin-inline:auto; }
.reference-scope-menu { position:absolute;top:calc(100% + 6px);left:0;z-index:200;min-width:220px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:.4rem;box-shadow:0 8px 24px rgba(0,0,0,.08); }
.reference-scope-menu button { width:100%;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.55rem .65rem;border:0;background:transparent;color:var(--text-primary);font: .72rem 'IBM Plex Mono',monospace;letter-spacing:normal;transform:none;box-shadow:none;text-align:left; }
.reference-scope-menu button.chosen,.reference-scope-menu button:hover { background:#f0f5ff;color:var(--text-primary); }
.reference-scope-menu span { color:var(--text-secondary);font-size:.6rem;white-space:nowrap; }
.reference-priority { display:inline-flex;align-items:center;gap:.35rem;font: .66rem 'IBM Plex Mono',monospace;white-space:nowrap; }
.reference-list .reference-priority>span:last-child { display:none; }
.reference-collapse { padding:.15rem .3rem; }
.reference-notice { display:flex;justify-content:space-between;align-items:center;background:#fffbe6;border:1px solid #ffe58f;border-radius:6px;font: .7rem 'IBM Plex Mono',monospace;padding:.55rem .8rem;margin:.5rem 0; }
.reference-notice button { padding:0 .2rem;border:0;background:transparent;color:var(--text-secondary);transform:none;box-shadow:none;letter-spacing:normal; }
.reference-layout-toggle:hover,.reference-sheet button:hover { transform:none;letter-spacing:normal; }
.reference-sheet { margin-top:.65rem;margin-inline:auto;width:calc(var(--reference-table-width) + 2px);max-width:100%; }
.reference-sheet-toolbar { display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;margin-bottom:.5rem; }
.reference-shared { font: .72rem 'IBM Plex Mono',monospace;color:var(--text-primary); }
.reference-shared>span { color:var(--text-secondary);font-size:.65rem; }
.reference-sheet-actions { margin-left:auto;display:flex;gap:.45rem;align-items:center;flex-wrap:wrap; }
.reference-sheet-actions .planning-action-button { min-height:32px;white-space:nowrap;letter-spacing:normal; }
.reference-count { background:#ece9e1;padding:.05rem .3rem;border-radius:4px;margin-left:.2rem;font-size:.6rem; }
.reference-sheet-meta { display:flex;gap:1rem;flex-wrap:wrap;justify-content:space-between;color:var(--text-secondary);font: .64rem 'IBM Plex Mono',monospace;margin:.7rem 0 .55rem; }
.reference-table-scroll { width:100%;overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-secondary);scrollbar-color:#b9b4aa #efede7;scrollbar-width:thin; }
.reference-table-scroll::-webkit-scrollbar { height:9px; }
.reference-table-scroll::-webkit-scrollbar-track { background:#efede7;border-radius:5px; }
.reference-table-scroll::-webkit-scrollbar-thumb { background:#b9b4aa;border:2px solid #efede7;border-radius:5px; }
.reference-table { table-layout:fixed;border-collapse:separate;border-spacing:0;width:var(--reference-table-width);font-size:.9rem; }
.reference-table th,.reference-table td { box-sizing:border-box;min-width:0;padding:.3rem .5rem;border-right:1px solid #e9e6df;border-bottom:1px solid #e9e6df;height:36px;background:var(--bg-secondary);vertical-align:middle; }
.reference-table th { height:44px;background:#f1efe9;font: .65rem 'IBM Plex Mono',monospace;font-weight:500;text-align:left;white-space:nowrap;color:var(--text-primary); }
.reference-table thead button { padding:0;border:0;border-radius:0;background:transparent;color:inherit;box-shadow:none;letter-spacing:normal;transform:none;font:inherit; }
.reference-table thead button:hover { color:var(--accent); }
.reference-column-kind { display:block;margin-top:.25rem;color:var(--text-secondary);font-weight:400;font-size:.57rem; }
.reference-table .numeric { text-align:right; }
.reference-table .reference-jira-number { font: .75rem 'IBM Plex Mono',monospace; }
.reference-table .reference-custom { background:#fcfcf7; }
.reference-table th.reference-custom { background:#edf1e6; }
.reference-table .reference-frozen { position:sticky;z-index:3;background:var(--bg-secondary); }
.reference-table th.reference-frozen { z-index:4;background:#f1efe9; }
.reference-table .select { left:0;width:30px;padding:.3rem .45rem; }
.reference-table .key { left:30px;width:96px; }
.reference-table .key a { font: .7rem 'IBM Plex Mono',monospace;color:var(--accent);text-decoration:none; }
.reference-table .summary { left:126px;width:260px;box-shadow:4px 0 5px -5px rgba(0,0,0,.2); }
.reference-table input[type=checkbox] { width:14px;height:14px;margin:0;accent-color:var(--good);cursor:pointer; }
.reference-table .reference-row-selected td { background:#f8fcf5; }
.reference-table .reference-row-selected td.reference-custom { background:#f6faf0; }
.reference-table tbody tr:hover td { background:#f3f5f0; }
.reference-table td.reference-custom input { width:100%;height:26px;box-sizing:border-box;padding:.2rem .3rem;border:1px solid transparent;background:transparent;border-radius:4px;font: .72rem 'IBM Plex Mono',monospace;color:var(--text-primary); }
.reference-table td.numeric input { text-align:right; }
.reference-table td.reference-custom input:hover { border-color:#d5dcc9;background:var(--bg-secondary); }
.reference-table td.reference-custom input:focus { border-color:var(--good);background:var(--bg-secondary);outline:2px solid #e1edd5;outline-offset:1px; }
.reference-table input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none;margin:0; }
.reference-table input::placeholder { color:#aaa69e; }
.reference-summary-edit,.reference-text-edit { display:flex;align-items:center;justify-content:space-between;gap:.5rem;width:100%;padding:0;border:0;background:transparent;color:var(--text-primary);text-align:left;font:inherit;line-height:1.3;box-shadow:none;letter-spacing:normal;transform:none; }
.reference-summary-edit,.reference-text-edit { text-transform:none; }
.reference-summary-text { min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.reference-table .task-status { font-family:'IBM Plex Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.02em; }
.reference-summary-edit svg,.reference-text-edit svg { opacity:0;flex-shrink:0; }
.reference-summary-edit:hover,.reference-text-edit:hover { background:transparent;color:var(--text-primary);box-shadow:none;transform:none; }
.reference-summary-edit:hover svg,.reference-summary-edit:focus-visible svg,.reference-text-edit:hover svg,.reference-text-edit:focus-visible svg { opacity:1;color:var(--text-secondary); }
.reference-parent { display:block;color:var(--text-secondary);font: .56rem 'IBM Plex Mono',monospace;margin-top:.2rem; }
.reference-team-value { font: .65rem 'IBM Plex Mono',monospace; }
.reference-row-menu { width:24px;height:26px;border:1px solid transparent;border-radius:5px;padding:0;background:transparent;color:var(--text-secondary);box-shadow:none;transform:none;letter-spacing:normal;font-size:1rem; }
.reference-row-menu:hover { background:var(--bg-secondary);border-color:var(--border);color:var(--text-primary); }
.reference-table tfoot td { height:40px;background:#f1efe9;font: .72rem 'IBM Plex Mono',monospace;border-bottom:0;font-weight:500; }
.reference-table tfoot .reference-frozen { background:#f1efe9; }
.reference-table tfoot td.reference-custom { background:#edf1e6; }
.reference-table tfoot .summary span { font-size:.58rem;font-weight:400;color:var(--text-secondary);margin-left:.65rem; }
.reference-sheet-footnote { display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:.65rem;font: .61rem 'IBM Plex Mono',monospace;color:var(--text-secondary); }
.reference-dialog-backdrop { position:fixed;inset:0;z-index:500;background:rgba(26,26,26,.24);display:grid;place-items:center;padding:1rem; }
.reference-dialog { box-sizing:border-box;width:440px;max-width:100%;max-height:85vh;overflow:auto;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;box-shadow:0 12px 40px rgba(0,0,0,.12); }
.reference-dialog-header { display:flex;justify-content:space-between;align-items:center;gap:.7rem; }
.reference-dialog h2 { font-size:1.3rem;font-weight:600;margin:0; }
.reference-dialog h3 { font-size:1rem;margin:1rem 0 .5rem; }
.reference-dialog p { margin:.7rem 0;color:var(--text-secondary);font-size:.9rem;line-height:1.4; }
.reference-dialog label { display:block;font: .7rem 'IBM Plex Mono',monospace;margin:.65rem 0; }
.reference-dialog input:not([type=checkbox]),.reference-dialog select { display:block;box-sizing:border-box;width:100%;height:38px;border:1px solid var(--border);border-radius:6px;background:var(--bg-primary);font: .74rem 'IBM Plex Mono',monospace;color:var(--text-primary);padding:.4rem .6rem;margin-top:.4rem; }
.reference-dialog-header button { background:transparent;color:var(--text-secondary);border:0;box-shadow:none;padding:0 .3rem;font-size:1.2rem;transform:none;letter-spacing:normal; }
.reference-dialog .reference-checkbox { display:flex;align-items:center;gap:.5rem; }
.reference-column-row { display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:.2rem 0;font: .72rem 'IBM Plex Mono',monospace; }
.reference-column-row small { color:var(--text-secondary);margin-left:.5rem;font-size:.6rem; }
.reference-column-row label { display:flex;gap:.4rem;align-items:center;font-size:.64rem; }
.reference-dialog .reference-field-choice { display:flex;align-items:center;justify-content:space-between;width:100%;padding:.7rem .2rem;border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;color:var(--text-primary);font: .76rem 'IBM Plex Mono',monospace;box-shadow:none;transform:none;letter-spacing:normal; }
.reference-dialog-actions { display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem; }
.reference-sort-row { display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem; }
.reference-sort-row select { margin:0; }
.reference-dialog .planning-action-button { letter-spacing:normal; }
.reference-dialog .planning-action-button:hover { transform:none;letter-spacing:normal; }
@media(max-width:900px) { .reference-strip { flex-wrap:wrap; }.reference-strip>span:last-child { display:none; }.reference-shared>span { display:block;margin-top:.3rem; }.reference-sheet-actions { margin-left:0; }.reference-table .summary { position:static;box-shadow:none; }.reference-sheet-meta { justify-content:flex-start; }.reference-sheet-footnote { font-size:.58rem; } }
